# Baut, testet und veröffentlicht die Webseite auf GitHub Pages
# (https://acortese-wq.github.io/Tiefbauleitung/) bei jedem Push auf main.
# Pull Requests (z. B. von Dependabot) werden nur gebaut und getestet, nicht veröffentlicht.
# Voraussetzung: Settings → Pages → Source: «GitHub Actions».
name: GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  bauen-und-testen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npx astro check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Statischer Build und Tests im Unterordner
        run: npm run test:pages
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  veroeffentlichen:
    needs: bauen-und-testen
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
